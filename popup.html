<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tweakers Hide Users</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="images/icon-48.png" width="28" height="28" alt="" />
      <div>
        <h1>Tweakers Hide Users</h1>
        <p id="page-status" class="status">Open a Tweakers page to get started.</p>
      </div>
    </header>
    <button id="enable-page" type="button" hidden>Enable on this page</button>
    <p id="page-count" class="page-count" hidden></p>

    <div class="add-row">
      <input id="new-user" type="text" placeholder="Add username" autocomplete="off" />
      <button id="add-user" type="button">Hide</button>
    </div>
    <input id="filter" type="search" placeholder="Filter list" hidden />
    <ul id="user-list"></ul>
    <p id="empty" class="empty">Nobody hidden yet. Click Hide under a post, or add a name here.</p>

    <details class="bulk">
      <summary>Paste list, export, import</summary>
      <p class="hint">One username per line.</p>
      <textarea id="config" spellcheck="false" placeholder="One username per line"></textarea>
      <div class="btn-row">
        <button id="save-config" type="button">Save list</button>
        <button id="export-json" type="button" class="secondary">Export</button>
        <label class="secondary file-label">
          Import
          <input id="import-json" type="file" accept="application/json,.json,.txt" hidden />
        </label>
      </div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
